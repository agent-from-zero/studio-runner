name: login-test
on: workflow_dispatch
jobs:
  login:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Studio
        shell: pwsh
        run: ./scripts/install-studio.ps1
      - name: Launch Studio and sign in as the agent account
        shell: pwsh
        run: |
          ./scripts/approve-signin.ps1 -Cookie "${{ secrets.RBX_COOKIE }}"
          Start-Sleep 20
          ./scripts/screenshot.ps1 -Out shot.png
          Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Format-Table Id, @{n='MB';e={[int]($_.WS/1MB)}}
          $log = Get-ChildItem "$env:LOCALAPPDATA\Roblox\logs" -Filter '*Studio*' | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($log) { Select-String -Path $log.FullName -Pattern 'Authenticated|LoginController|StudioKeyEvents] login' | Select-Object -Last 15 | ForEach-Object { $_.Line -replace '"code":"[A-Z0-9]+"','"code":"[hidden]"' -replace 'privateKey":"[^"]+','privateKey":"[hidden]' } }
      - uses: actions/upload-artifact@v4
        with: { name: login, path: shot.png }
