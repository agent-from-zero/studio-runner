name: desktop
on:
  workflow_dispatch:
    inputs:
      minutes: { description: 'How long to keep the machine (max 350)', default: '120' }
      attempt: { description: 'Machine attempt number (Studio shows the code sign-in on about half of machines)', default: '1' }
permissions:
  contents: read
  issues: write
  actions: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Studio
        shell: pwsh
        run: ./scripts/install-studio.ps1
      - name: Remote desktop
        shell: pwsh
        run: ./scripts/start-desktop.ps1
      - name: Launch Studio signed in as the agent account
        id: signin
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/approve-signin.ps1 -Cookie "${{ secrets.RBX_COOKIE }}"
      - name: Wrong sign-in screen on this machine, start a fresh one
        if: steps.signin.outcome == 'failure' && fromJSON(inputs.attempt) < 8
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $next = [int]'${{ inputs.attempt }}' + 1
          $body = @{ ref = 'main'; inputs = @{ minutes = '${{ inputs.minutes }}'; attempt = "$next" } } | ConvertTo-Json
          Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/desktop.yml/dispatches" -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Body $body
          "started machine attempt $next"
      - name: Serve the desktop (viewer link posted encrypted) and stay up
        if: steps.signin.outcome == 'success'
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ./scripts/serve-desktop.ps1
          ./scripts/publish-session.ps1 -ViewKey "${{ secrets.VIEW_KEY }}"
          $end = (Get-Date).AddMinutes([int]'${{ inputs.minutes }}')
          while ((Get-Date) -lt $end) {
            Start-Sleep 30
            if (-not (Get-Process cloudflared -ErrorAction SilentlyContinue)) { 'tunnel process ended'; break }
          }
      - name: Remove the link
        if: always()
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $c = Get-Content "$env:RUNNER_TEMP\comment.txt" -ErrorAction SilentlyContinue
          if ($c) { Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/comments/$c" -Method Delete -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } }
